[star]
name = "orrery/spdx-license"
version = "0.1.0"
description = "Bounded SPDX license text and metadata for named allowlisted identifiers"
publisher = "orrery"
publisher_key_id_env = "ORRERY_SPDX_LICENSE_KEY_ID"
direct_mcp_path = "/stars/spdx-license/mcp"
tools = ["get"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.spdx_license"
skill_factory = "stars.spdx_license.skill:build_skill"
[policy]
allowed_egress = ["https://spdx.org"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 524288
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.spdx_license.corpus:CORPUS"
