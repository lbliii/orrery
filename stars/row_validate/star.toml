[star]
name = "orrery/row-validate"
version = "0.1.0"
description = "Pure validation of one row against a named static source-aligned profile"
publisher = "orrery"
publisher_key_id_env = "ORRERY_ROW_VALIDATE_KEY_ID"
direct_mcp_path = "/stars/row-validate/mcp"
tools = ["validate"]
capability_families = ["data"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.row_validate"
skill_factory = "stars.row_validate.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.row_validate.corpus:CORPUS"
