[star]
name = "orrery/patch-capture"
version = "0.1.0"
description = "Capture a sealed patch digest from before/after caller file snapshots"
publisher = "orrery"
publisher_key_id_env = "ORRERY_PATCH_CAPTURE_KEY_ID"
direct_mcp_path = "/stars/patch-capture/mcp"
tools = ["capture"]
capability_families = ["security"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.patch_capture"
skill_factory = "stars.patch_capture.skill:build_skill"
[policy]
allowed_egress = []
freshness = "caller_provided"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.patch_capture.corpus:CORPUS"
