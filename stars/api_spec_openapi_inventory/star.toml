[star]
name = "orrery/api-spec-openapi-inventory"
version = "0.1.0"
description = "Deterministic OpenAPI inventory with classified findings and scoped $ref policy"
publisher = "orrery"
publisher_key_id_env = "ORRERY_API_SPEC_OPENAPI_INVENTORY_KEY_ID"
direct_mcp_path = "/stars/api-spec-openapi-inventory/mcp"
tools = ["inventory"]
capability_families = ["migration"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.api_spec_openapi_inventory"
skill_factory = "stars.api_spec_openapi_inventory.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.api_spec_openapi_inventory.corpus:CORPUS"
