[star]
name = "orrery/manifest-preflight"
version = "0.1.0"
description = "Preflight a caller file manifest against a named versioned policy"
publisher = "orrery"
publisher_key_id_env = "ORRERY_MANIFEST_PREFLIGHT_KEY_ID"
direct_mcp_path = "/stars/manifest-preflight/mcp"
tools = ["check"]
capability_families = ["security"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.manifest_preflight"
skill_factory = "stars.manifest_preflight.skill:build_skill"
[policy]
allowed_egress = []
freshness = "caller_provided"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.manifest_preflight.corpus:CORPUS"
