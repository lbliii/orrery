[star]
name = "orrery/structure-audit"
version = "0.1.0"
description = "Pure markdown structure audit with coded findings"
publisher = "orrery"
publisher_key_id_env = "ORRERY_STRUCTURE_AUDIT_KEY_ID"
direct_mcp_path = "/stars/structure-audit/mcp"
tools = ["audit"]
capability_families = ["document_processing"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.structure_audit"
skill_factory = "stars.structure_audit.skill:build_skill"
[policy]
allowed_egress = []
freshness = "caller_provided"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.structure_audit.corpus:CORPUS"
