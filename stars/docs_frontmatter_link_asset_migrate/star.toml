[star]
name = "orrery/docs-frontmatter-link-asset-migrate"
version = "0.1.0"
description = "Profile-driven frontmatter, link, anchor, and asset migration with patch + report"
publisher = "orrery"
publisher_key_id_env = "ORRERY_DOCS_FRONTMATTER_LINK_ASSET_MIGRATE_KEY_ID"
direct_mcp_path = "/stars/docs-frontmatter-link-asset-migrate/mcp"
tools = ["migrate"]
capability_families = ["migration"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.docs_frontmatter_link_asset_migrate"
skill_factory = "stars.docs_frontmatter_link_asset_migrate.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.docs_frontmatter_link_asset_migrate.corpus:CORPUS"
