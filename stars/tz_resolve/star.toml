[star]
name = "orrery/tz-resolve"
version = "0.1.0"
description = "Resolve lat/lon or allowlisted place token to an IANA timezone"
publisher = "orrery"
publisher_key_id_env = "ORRERY_TZ_RESOLVE_KEY_ID"
direct_mcp_path = "/stars/tz-resolve/mcp"
tools = ["resolve", "answer"]
capability_families = ["time_and_date"]

[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"

[runtime]
python_package = "stars.tz_resolve"
skill_factory = "stars.tz_resolve.skill:build_skill"

[policy]
allowed_egress = []
freshness = "at_call"
redirects = "deny"
max_response_bytes = 4096

[receipt]
schema_version = "1"
algorithm = "Ed25519"

[publish]
corpus = "stars.tz_resolve.corpus:CORPUS"
