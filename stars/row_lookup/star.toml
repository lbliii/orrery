[star]
name = "orrery/row-lookup"
version = "0.1.0"
description = "Exact typed row lookup in a named allowlisted public CSV dataset"
publisher = "orrery"
publisher_key_id_env = "ORRERY_ROW_LOOKUP_KEY_ID"
direct_mcp_path = "/stars/row-lookup/mcp"
tools = ["lookup"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.row_lookup"
skill_factory = "stars.row_lookup.skill:build_skill"
[policy]
allowed_egress = ["https://raw.githubusercontent.com"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 524288
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.row_lookup.corpus:CORPUS"
