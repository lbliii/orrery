[star]
name = "orrery/pep-section"
version = "0.1.0"
description = "Pull a specific Python PEP section for language-spec answers"
publisher = "orrery"
publisher_key_id_env = "ORRERY_PEP_SECTION_KEY_ID"
direct_mcp_path = "/stars/pep-section/mcp"
tools = ["get"]
capability_families = ["source_monitoring"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.pep_section"
skill_factory = "stars.pep_section.skill:build_skill"
[policy]
allowed_egress = ["https://peps.python.org"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 524288
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.pep_section.corpus:CORPUS"
