[star]
name = "orrery/well-known"
version = "0.1.0"
description = "Read a fresh slice of an official discovery document"
publisher = "orrery"
publisher_key_id_env = "ORRERY_WELL_KNOWN_KEY_ID"
direct_mcp_path = "/stars/well-known/mcp"
tools = ["read"]
capability_families = ["web_metadata"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.well_known"
skill_factory = "stars.well_known.skill:build_skill"
[policy]
allowed_egress = ["https://orrery.lol"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.well_known.corpus:CORPUS"
