[star]
name = "orrery/docs-myst-inventory"
version = "0.1.0"
description = "Deterministic MyST documentation tree inventory with classified findings"
publisher = "orrery"
publisher_key_id_env = "ORRERY_DOCS_MYST_INVENTORY_KEY_ID"
direct_mcp_path = "/stars/docs-myst-inventory/mcp"
tools = ["inventory"]
capability_families = ["migration"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.docs_myst_inventory"
skill_factory = "stars.docs_myst_inventory.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.docs_myst_inventory.corpus:CORPUS"
