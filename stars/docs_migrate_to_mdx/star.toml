[star]
name = "orrery/docs-migrate-to-mdx"
kind = "constellation"
version = "0.1.0"
description = "Frozen MyST→MDX migration graph with decision pause and composite receipt (#178)"
publisher = "orrery"
publisher_key_id_env = "ORRERY_DOCS_MIGRATE_TO_MDX_KEY_ID"
