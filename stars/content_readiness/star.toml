[star]
name = "orrery/content-readiness"
kind = "constellation"
version = "0.1.0"
description = "Assess a caller content bundle: manifest, structure, bounded links → sealed disposition"
publisher = "orrery"
publisher_key_id_env = "ORRERY_CONTENT_READINESS_KEY_ID"
direct_mcp_path = "/constellations/content-readiness/mcp"
tools = ["run"]
capability_families = ["document_processing"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.content_readiness"
skill_factory = "stars.content_readiness.skill:build_skill"
[policy]
allowed_egress = ["https://example.com", "https://docs.python.org"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 262144
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.content_readiness.corpus:CORPUS"
