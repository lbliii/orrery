[star]
name = "orrery/api-spec-openapi-validate"
version = "0.1.0"
description = "Pinned OpenAPI 3.1 parser/schema validation for sealed migration change bundles"
publisher = "orrery"
publisher_key_id_env = "ORRERY_API_SPEC_OPENAPI_VALIDATE_KEY_ID"
direct_mcp_path = "/stars/api-spec-openapi-validate/mcp"
tools = ["validate"]
capability_families = ["migration"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.api_spec_openapi_validate"
skill_factory = "stars.api_spec_openapi_validate.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.api_spec_openapi_validate.corpus:CORPUS"
