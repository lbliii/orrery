[star]
name="orrery/npm-release"
version="0.1.0"
description = "Get latest dist-tag metadata for an npm package"
publisher="orrery"
publisher_key_id_env="ORRERY_NPM_RELEASE_KEY_ID"
direct_mcp_path="/stars/npm-release/mcp"
tools=["get"]
capability_families = ["source_monitoring"]
[pricing]
unit="call"
price_per_call="0.00"
currency="USD"
[runtime]
python_package="stars.npm_release"
skill_factory="stars.npm_release.skill:build_skill"
[policy]
allowed_egress=["https://registry.npmjs.org"]
freshness="at_call"
redirects="deny"
max_response_bytes=524288
[receipt]
schema_version="1"
algorithm="Ed25519"
[publish]
corpus="stars.npm_release.corpus:CORPUS"
