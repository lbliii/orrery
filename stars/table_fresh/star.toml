[star]
name = "orrery/table-fresh"
kind = "constellation"
version = "0.1.0"
description = "Sample live tabular data and diff against a baseline"
publisher = "orrery"
publisher_key_id_env = "ORRERY_TABLE_FRESH_KEY_ID"
direct_mcp_path = "/constellations/table-fresh/mcp"
tools = ["run"]
capability_families = ["data"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.table_fresh"
skill_factory = "stars.table_fresh.skill:build_skill"
[policy]
allowed_egress = ["https://raw.githubusercontent.com"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 524288
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.table_fresh.corpus:CORPUS"
