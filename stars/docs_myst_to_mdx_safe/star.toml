[star]
name = "orrery/docs-myst-to-mdx-safe"
version = "0.1.0"
description = "Corpus-backed safe MyST to baseline MDX transform with sealed change bundles"
publisher = "orrery"
publisher_key_id_env = "ORRERY_DOCS_MYST_TO_MDX_SAFE_KEY_ID"
direct_mcp_path = "/stars/docs-myst-to-mdx-safe/mcp"
tools = ["plan", "apply"]
capability_families = ["migration"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.docs_myst_to_mdx_safe"
skill_factory = "stars.docs_myst_to_mdx_safe.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.docs_myst_to_mdx_safe.corpus:CORPUS"
