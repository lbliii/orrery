[star]
name = "orrery/holidays"
version = "0.1.0"
description = "Allowlisted region code and year to a pinned public holiday list"
publisher = "orrery"
publisher_key_id_env = "ORRERY_HOLIDAYS_KEY_ID"
direct_mcp_path = "/stars/holidays/mcp"
tools = ["list", "answer"]
capability_families = ["time_and_date"]

[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"

[runtime]
python_package = "stars.holidays"
skill_factory = "stars.holidays.skill:build_skill"

[policy]
allowed_egress = []
freshness = "at_call"
redirects = "deny"
max_response_bytes = 65536

[receipt]
schema_version = "1"
algorithm = "Ed25519"

[publish]
corpus = "stars.holidays.corpus:CORPUS"
