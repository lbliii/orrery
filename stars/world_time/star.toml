[star]
name = "orrery/world-time"
version = "0.1.0"
description = "Live UTC truth at call time; offline clones are stale"
publisher = "orrery"
publisher_key_id_env = "ORRERY_WORLD_TIME_KEY_ID"
direct_mcp_path = "/stars/world-time/mcp"
tools = ["fetch", "get", "answer"]

[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"

[runtime]
python_package = "stars.world_time"
skill_factory = "stars.world_time.skill:build_skill"

[policy]
allowed_egress = ["https://timeapi.io", "https://www.google.com"]
freshness = "live_at_call"
redirects = "deny"
max_response_bytes = 1048576

[receipt]
schema_version = "1"
algorithm = "Ed25519"

[publish]
corpus = "stars.world_time.corpus:CORPUS"
