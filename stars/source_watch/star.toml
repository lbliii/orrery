[star]
name = "orrery/source-watch"
version = "0.1.0"
description = "Live official-source evidence, digest comparison, and bounded answers"
publisher = "orrery"
publisher_key_id_env = "ORRERY_SOURCE_WATCH_KEY_ID"
direct_mcp_path = "/stars/source-watch/mcp"
tools = ["observe", "diff", "answer"]
capability_families = ["source_monitoring"]

[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"

[runtime]
python_package = "stars.source_watch"
skill_factory = "stars.source_watch.skill:build_skill"

[policy]
allowed_egress = ["https://docs.python.org"]
freshness = "live_at_call"
redirects = "deny"
max_response_bytes = 1048576

[receipt]
schema_version = "1"
algorithm = "Ed25519"

[publish]
corpus = "stars.source_watch.corpus:CORPUS"
