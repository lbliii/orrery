[star]
name = "orrery/http-head"
version = "0.1.0"
description = "Fresh HTTP metadata for named allowlisted official targets"
publisher = "orrery"
publisher_key_id_env = "ORRERY_HTTP_HEAD_KEY_ID"
direct_mcp_path = "/stars/http-head/mcp"
tools = ["head"]
capability_families = ["web_metadata"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.http_head"
skill_factory = "stars.http_head.skill:build_skill"
[policy]
allowed_egress = ["https://docs.python.org", "https://timeapi.io"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 16384
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.http_head.corpus:CORPUS"
