[star]
name = "orrery/migration-git-handoff"
version = "0.1.0"
description = "Digest-only Git/PR handoff receipt for sealed migration bundles"
publisher = "orrery"
publisher_key_id_env = "ORRERY_MIGRATION_GIT_HANDOFF_KEY_ID"
direct_mcp_path = "/stars/migration-git-handoff/mcp"
tools = ["handoff"]
capability_families = ["security"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.migration_git_handoff"
skill_factory = "stars.migration_git_handoff.skill:build_skill"
[policy]
allowed_egress = []
freshness = "static_profile"
redirects = "deny"
max_response_bytes = 65536
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.migration_git_handoff.corpus:CORPUS"
