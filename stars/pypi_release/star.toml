[star]
name="orrery/pypi-release"
version="0.1.0"
description = "Get current release metadata for a PyPI package"
publisher="orrery"
publisher_key_id_env="ORRERY_PYPI_RELEASE_KEY_ID"
direct_mcp_path="/stars/pypi-release/mcp"
tools=["get"]
capability_families = ["source_monitoring"]
[pricing]
unit="call"
price_per_call="0.00"
currency="USD"
[runtime]
python_package="stars.pypi_release"
skill_factory="stars.pypi_release.skill:build_skill"
[policy]
allowed_egress=["https://pypi.org"]
freshness="at_call"
redirects="deny"
max_response_bytes=1048576
[receipt]
schema_version="1"
algorithm="Ed25519"
[publish]
corpus="stars.pypi_release.corpus:CORPUS"
