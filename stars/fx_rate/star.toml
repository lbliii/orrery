[star]
name = "orrery/fx-rate"
version = "0.1.0"
description = "Allowlisted FX pair and as-of date to a pinned exchange rate"
publisher = "orrery"
publisher_key_id_env = "ORRERY_FX_RATE_KEY_ID"
direct_mcp_path = "/stars/fx-rate/mcp"
tools = ["fx_rate", "answer"]
capability_families = ["data"]

[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"

[runtime]
python_package = "stars.fx_rate"
skill_factory = "stars.fx_rate.skill:build_skill"

[policy]
allowed_egress = []
freshness = "at_call"
redirects = "deny"
max_response_bytes = 4096

[receipt]
schema_version = "1"
algorithm = "Ed25519"

[publish]
corpus = "stars.fx_rate.corpus:CORPUS"
