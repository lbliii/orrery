[star]
name = "orrery/authorized-content-patch"
kind = "constellation"
version = "0.1.0"
description = "Governed content edit path: readiness → write-authority → patch-capture → sealed composite (never applies patches)"
publisher = "orrery"
publisher_key_id_env = "ORRERY_AUTHORIZED_CONTENT_PATCH_KEY_ID"
direct_mcp_path = "/constellations/authorized-content-patch/mcp"
tools = ["run"]
capability_families = ["document_processing"]
[pricing]
unit = "call"
price_per_call = "0.00"
currency = "USD"
[runtime]
python_package = "stars.authorized_content_patch"
skill_factory = "stars.authorized_content_patch.skill:build_skill"
[policy]
allowed_egress = ["https://example.com", "https://docs.python.org"]
freshness = "at_call"
redirects = "deny"
max_response_bytes = 262144
[receipt]
schema_version = "1"
algorithm = "Ed25519"
[publish]
corpus = "stars.authorized_content_patch.corpus:CORPUS"
