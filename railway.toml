# Orrery — Railway service config.
#
# GitHub (lbliii/orrery) → auto-deploy on main. Or `railway up` from repo root.
#
# Required service variables:
#   CHIRP_ENV=production
#   CHIRP_DEBUG=0
#   CHIRP_SECRET_KEY=<generated secret>
#   CHIRP_LOG_FORMAT=json
#   GIT_REF=main
#
# Stateless MCP (no sticky sessions) — safe to scale replicas later; keep
# ORRERY_SKIP_PUBLISH=0 (default) so boot records smoke ReliabilityScores.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# One repository backs the public API and its private managed-worker service.
# The web service leaves ORRERY_PROCESS_KIND unset; the worker service sets it
# to `worker` in Railway, so a shared source cannot accidentally run two web
# replicas instead of consuming the durable queue.
startCommand = "sh -c 'if [ \"${ORRERY_PROCESS_KIND:-web}\" = \"worker\" ]; then exec python -m runs.worker; else exec python app.py; fi'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
numReplicas = 1
