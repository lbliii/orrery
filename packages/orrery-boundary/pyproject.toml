[project]
name = "orrery-boundary"
version = "0.1.0"
description = "Optional local MCP adapter: export-at-ref + witness-approve for Orrery protocol stars."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  # Chirp Envelope sign/verify (same wire object write-authority-check consumes).
  "bengal-chirp[skill] @ git+https://github.com/lbliii/chirp.git@main",
  "cryptography>=44,<47",
  "mcp>=1.0,<2",
]

[project.scripts]
orrery-boundary = "orrery_boundary.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["orrery_boundary"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "issue(n): traces coverage to GitHub issue #n",
]
