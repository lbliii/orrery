name: World time public canary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  canary:
    # Live clock/signature check should be visible, never block application CI.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv run python scripts/canary_world_time.py --origin https://orrery.lol
