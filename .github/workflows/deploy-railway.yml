name: Deploy Orrery

# Keeps the live product (https://orrery-production-f7de.up.railway.app) current.
# The Dockerfile installs Chirp from git @ GIT_REF (default: main), NOT a PyPI
# wheel, so production tracks Chirp main's skill/MCP surface. `railway up`
# (not `redeploy`) is intentional: it rebuilds the image so the Dockerfile
# re-fetches Chirp at GIT_REF (the `ADD` of GitHub's commits API busts the
# install-layer cache when Chirp main advances). Railway healthchecks the new
# deployment (/health) and keeps the previous one serving if it fails.
#
# REQUIRED: a repo secret RAILWAY_TOKEN — a *project* token for the `orrery`
# Railway project (Railway dashboard → project → Settings → Tokens). A project
# token auto-scopes `railway up` to that project; no project linking needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys race; cancel an in-flight one when a newer push lands.
concurrency:
  group: deploy-orrery
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Don't fork-deploy: only the canonical repo holds the token.
    if: github.repository == 'lbliii/orrery'
    steps:
      - uses: actions/checkout@v7

      # Install via npm so the `railway` binary lands on PATH (the curl installer
      # drops it in ~/.railway/bin, which isn't on PATH in later steps -> exit 127).
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Rebuild + redeploy Orrery
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --ci: build, stream logs, wait, and exit non-zero on failure (red check).
        run: railway up --ci --service orrery
