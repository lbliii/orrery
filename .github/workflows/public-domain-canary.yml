name: Public domain canary

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

jobs:
  canary:
    # External reachability should be visible, never block application CI.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/canary_public_domain.py
